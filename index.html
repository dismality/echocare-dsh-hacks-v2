<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
</head>
<body>
<title>EchoCare Companion</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: health-app shell. Grouped soft surfaces (Apple Health Medications), a dose timeline (Medisafe), daily rings (Oura / Fitness). Sidebar on desktop, tab bar on phones. Elder app: one big card at a time. */
:root{
  --bg:#F1F4F3; --surface:#FFFFFF; --sunk:#E9EEEC; --ink:#0E1A17; --muted:#55635E; --line:#DCE3E0; --line-strong:#B6C2BE;
  --accent:#0B7A6E; --accent-soft:#DCF1EC; --accent-ink:#075A51; --on-accent:#FFFFFF;
  --ok:#1A7642; --ok-soft:#DEF2E4; --warn:#94580A; --warn-soft:#FCEFD6; --crit:#BE3329; --crit-soft:#FBE3E0;
  --ring-dose:#12A391; --ring-check:#E79A1C; --ring-social:#E35D4A; --ring-track:#E3E9E7;
  --shadow:0 1px 2px rgba(14,26,23,.05),0 6px 20px rgba(14,26,23,.05);
  --scrim:rgba(8,16,14,.5);
  --e-bg:#F7F9F8; --e-card:#FFFFFF; --e-ink:#0A1412; --e-sub:#3A4743; --e-edge:#C9D3CF; --e-primary:#10201C; --e-on-primary:#FFFFFF;
  --f-display:"Bricolage Grotesque","Avenir Next",system-ui,sans-serif; --f-body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif; --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --r:18px; --r-sm:12px; --side:236px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0B1110; --surface:#141C1A; --sunk:#1C2624; --ink:#E7EFEC; --muted:#9AA9A4; --line:#25312E; --line-strong:#3B4945;
  --accent:#3CC9B5; --accent-soft:#103430; --accent-ink:#79E3D3; --on-accent:#03201B;
  --ok:#62D08E; --ok-soft:#11301F; --warn:#F2B451; --warn-soft:#33260E; --crit:#FF7D70; --crit-soft:#3A1713;
  --ring-dose:#3CC9B5; --ring-check:#F2B451; --ring-social:#FF8A75; --ring-track:#24302D;
  --shadow:0 1px 2px rgba(0,0,0,.4); --scrim:rgba(0,0,0,.62);
  --e-bg:#0B1110; --e-card:#151E1C; --e-ink:#F1F7F5; --e-sub:#BAC7C3; --e-edge:#34433F; --e-primary:#E7EFEC; --e-on-primary:#0B1110;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0B1110; --surface:#141C1A; --sunk:#1C2624; --ink:#E7EFEC; --muted:#9AA9A4; --line:#25312E; --line-strong:#3B4945;
  --accent:#3CC9B5; --accent-soft:#103430; --accent-ink:#79E3D3; --on-accent:#03201B;
  --ok:#62D08E; --ok-soft:#11301F; --warn:#F2B451; --warn-soft:#33260E; --crit:#FF7D70; --crit-soft:#3A1713;
  --ring-dose:#3CC9B5; --ring-check:#F2B451; --ring-social:#FF8A75; --ring-track:#24302D;
  --shadow:0 1px 2px rgba(0,0,0,.4); --scrim:rgba(0,0,0,.62);
  --e-bg:#0B1110; --e-card:#151E1C; --e-ink:#F1F7F5; --e-sub:#BAC7C3; --e-edge:#34433F; --e-primary:#E7EFEC; --e-on-primary:#0B1110;
  color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 calc(96px + env(safe-area-inset-bottom,0px))}
h1,h2,h3{font-family:var(--f-display);font-weight:600;line-height:1.15;letter-spacing:-.015em;text-wrap:balance;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.app{max-width:1180px;margin:0 auto}
main{min-width:0}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-block:18px 18px}
.brand{display:flex;align-items:center;gap:10px}
.logo{width:36px;height:36px;border-radius:11px;background:var(--accent);display:grid;place-items:center;flex:none}
.logo svg path{stroke:var(--on-accent)}
.brand b{font-family:var(--f-display);font-weight:700;font-size:20px;letter-spacing:-.02em}
.brand small{display:block;color:var(--muted);font-size:12px;line-height:1.2}
.who{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.patient{display:flex;align-items:center;gap:8px;background:var(--surface);border-radius:999px;padding:4px 14px 4px 4px;font-size:13px;font-weight:700;box-shadow:var(--shadow)}
.avatar{width:30px;height:30px;border-radius:50%;background:var(--accent-soft);color:var(--accent-ink);display:grid;place-items:center;font-weight:700;font-size:12px}
.savestate{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.savestate i{width:8px;height:8px;border-radius:50%;background:var(--muted);display:inline-block}
.savestate.ok i{background:var(--ok)} .savestate.busy i{background:var(--warn)} .savestate.err i{background:var(--crit)}

/* navigation: tab bar on phones, sidebar on desktop */
nav.bottom{position:fixed;left:0;right:0;bottom:0;z-index:15;background:color-mix(in srgb,var(--surface) 88%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line);
  padding:6px max(10px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px))}
nav.bottom .in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(var(--n,5),minmax(0,1fr));gap:4px}
nav.bottom button{position:relative;border:0;background:transparent;border-radius:14px;padding:7px 4px 5px;display:flex;flex-direction:column;align-items:center;gap:2px;font-weight:700;font-size:12px;color:var(--muted);min-height:56px}
nav.bottom button svg{width:24px;height:24px}
nav.bottom button:hover{color:var(--ink)}
nav.bottom button[aria-current="page"]{color:var(--accent-ink)}
nav.bottom button[aria-current="page"] svg{background:var(--accent-soft);border-radius:999px;padding:2px 10px;width:44px;box-sizing:content-box;margin-inline:-10px}
nav.bottom .cnt{position:absolute;top:2px;left:calc(50% + 10px)}
@media (min-width:1024px){
  body[data-app="family"]{padding-left:calc(var(--side) + 32px);padding-bottom:48px}
  nav.bottom{top:0;bottom:0;right:auto;width:var(--side);border-top:0;border-right:1px solid var(--line);padding:84px 14px 20px max(14px,env(safe-area-inset-left,0px));background:var(--surface);backdrop-filter:none}
  nav.bottom .in{display:flex;flex-direction:column;gap:2px;max-width:none}
  nav.bottom button{flex-direction:row;justify-content:flex-start;gap:12px;min-height:46px;padding:10px 12px;font-size:15px;border-radius:12px}
  nav.bottom button:hover{background:var(--sunk)}
  nav.bottom button[aria-current="page"]{background:var(--accent-soft)}
  nav.bottom button[aria-current="page"] svg{background:none;padding:0;width:24px;margin:0}
  nav.bottom .cnt{position:static;margin-left:auto}
  .topbar{padding-block:22px 22px}
}
.cnt{font-size:11px;font-weight:700;border-radius:999px;padding:0 6px;line-height:17px;background:var(--sunk);color:var(--muted);font-variant-numeric:tabular-nums}
.cnt.crit{background:var(--crit);color:var(--surface)} .cnt.warn{background:var(--warn);color:var(--surface)}
.subtabs{display:flex;gap:4px;overflow-x:auto;padding:4px;margin-bottom:18px;background:var(--sunk);border-radius:14px;width:max-content;max-width:100%}
.subtabs button{flex:none;border:0;background:transparent;border-radius:10px;padding:7px 14px;font-weight:700;font-size:14px;color:var(--muted);display:inline-flex;gap:6px;align-items:center}
.subtabs button[aria-current="page"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.modes{display:flex;background:var(--sunk);border-radius:10px;padding:3px;gap:2px}
.modes button{border:0;background:transparent;border-radius:8px;padding:6px 12px;font-weight:700;font-size:13px;color:var(--muted)}
.modes button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.sizer{display:flex;gap:2px;align-items:center}
.sizer button{border:1px solid var(--line);background:var(--surface);border-radius:8px;width:34px;height:32px;font-weight:700}

/* countdown */
.cd{font-family:var(--f-mono);font-size:12px;border-radius:999px;padding:2px 9px;background:var(--sunk);color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.cd.soon{background:var(--warn-soft);color:var(--warn)} .cd.late{background:var(--crit-soft);color:var(--crit)} .cd.done{background:var(--ok-soft);color:var(--ok)}

/* overlays */
.overlay{position:fixed;inset:0;z-index:30;background:var(--scrim);display:grid;place-items:center;padding:20px max(16px,env(safe-area-inset-right,0px)) 20px max(16px,env(safe-area-inset-left,0px))}
.remind{background:var(--surface);color:var(--ink);border-radius:28px;max-width:460px;width:100%;padding:26px;display:grid;gap:14px;box-shadow:0 30px 70px rgba(0,0,0,.28)}
.remind .bell{width:56px;height:56px;border-radius:18px;background:var(--accent-soft);color:var(--accent-ink);display:grid;place-items:center}
.remind h2{font-size:26px}
.remind ul{margin:0;padding:0;list-style:none;display:grid;gap:8px}
.remind li{background:var(--sunk);border-radius:14px;padding:10px 12px;font-size:18px}
.remind li small{display:block;font-size:14px;color:var(--muted)}
.remind textarea{min-height:120px}
.big{font-size:19px;padding:15px 18px;border-radius:16px;justify-content:center;width:100%}
.rowbtns{display:grid;grid-template-columns:1fr 1fr;gap:8px}

/* ===== Elder app: one task per screen, very large type, theme-aware ===== */
body[data-app="elder"]{background:var(--e-bg);color:var(--e-ink);padding-bottom:28px}
body[data-app="elder"] .overlay .remind{background:var(--e-card);color:var(--e-ink)}
.phoneframe{max-width:380px;margin:0 auto;border:10px solid var(--ink);border-radius:44px;background:var(--e-bg);padding:22px 14px;max-height:660px;overflow-y:auto}
.phoneframe .elderskin{zoom:.8;padding-block:0}
.pindots{display:flex;gap:14px;justify-content:center}
.pindots i{width:18px;height:18px;border-radius:50%;border:2px solid var(--ink)}
.pindots i.on{background:var(--ink)}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.keypad button{height:64px;border-radius:18px;border:0;background:var(--sunk);font-size:26px;font-weight:700}
#elder,.elderskin{max-width:600px;margin:0 auto;padding-block:24px 12px;display:grid;gap:16px;font-family:var(--f-body);font-size:20px;line-height:1.4;color:var(--e-ink)}
#elder :focus-visible{outline:4px solid var(--accent);outline-offset:3px}
.e-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.e-hello{font-family:var(--f-display);font-size:clamp(30px,7.4vw,40px);line-height:1.08;font-weight:600;letter-spacing:-.02em;margin:0}
.e-date{font-size:20px;color:var(--e-sub);margin-top:6px}
.e-sun{width:58px;height:58px;flex:none}
.e-card{background:var(--e-card);border:2px solid var(--e-edge);border-radius:30px;padding:22px;display:grid;gap:14px}
.e-label{font-size:19px;font-weight:700;color:var(--e-sub);text-transform:uppercase;letter-spacing:.05em}
.e-time{font-family:var(--f-display);font-size:44px;line-height:1;font-weight:600;letter-spacing:-.02em}
.e-when{justify-self:start;font-size:19px;font-weight:700;padding:6px 16px;border-radius:999px;background:var(--accent-soft);color:var(--accent-ink)}
.e-when.late{background:var(--crit-soft);color:var(--crit)}
.e-when.done{background:var(--ok-soft);color:var(--ok)}
.e-pills{display:grid;gap:12px}
.e-pill{display:flex;align-items:center;gap:14px;font-size:21px;background:var(--e-bg);border-radius:20px;padding:12px}
.e-pill .pic{flex:none;width:76px;display:grid;place-items:center}
.e-pill small{display:block;font-size:17px;color:var(--e-sub)}
.e-btn{display:flex;align-items:center;justify-content:center;gap:12px;width:100%;border:0;border-radius:24px;padding:18px 20px;font-size:23px;font-weight:700;min-height:80px;font-family:var(--f-body);transition:transform .12s}
.e-btn:active{transform:scale(.98)}
.e-btn svg{width:34px;height:34px;flex:none}
.e-green{background:var(--accent);color:var(--on-accent)}
.e-blue{background:var(--e-primary);color:var(--e-on-primary)}
.e-white{background:var(--e-card);color:var(--e-ink);border:2px solid var(--e-edge)}
.e-red{background:var(--crit);color:var(--surface)}
.e-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.e-grid .e-btn{flex-direction:column;min-height:136px;font-size:21px}
.e-msg{display:flex;gap:14px;align-items:flex-start}
.e-msg .who{font-size:18px;font-weight:700;color:var(--e-sub)}
.e-msg p{margin:2px 0 0;font-size:23px}
.e-play{border:2px solid var(--accent);background:transparent;color:var(--accent-ink);border-radius:16px;padding:10px 16px;font-size:19px;font-weight:700;display:inline-flex;gap:8px;align-items:center}
.e-play svg{width:24px;height:24px}
.e-back{background:none;border:0;font-size:21px;font-weight:700;color:var(--accent-ink);padding:6px 0;display:inline-flex;align-items:center;gap:8px;justify-self:start}
.e-back svg{width:26px;height:26px}
.e-h{font-family:var(--f-display);font-size:32px;font-weight:600;margin:0}
.e-say{display:flex;gap:14px;align-items:flex-start}
.e-say .face{width:56px;height:56px;border-radius:18px;background:var(--accent);display:grid;place-items:center;flex:none}
.e-say .face svg path,.e-say .face svg rect{stroke:var(--on-accent)}
.e-say p{margin:0;font-size:clamp(23px,5.6vw,28px);line-height:1.32;font-family:var(--f-display);font-weight:500}
.e-you{justify-self:end;background:var(--e-primary);color:var(--e-on-primary);border-radius:22px 22px 6px 22px;padding:10px 18px;font-size:20px;max-width:85%}
.e-opts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.e-opt{background:var(--e-card);border:2px solid var(--e-edge);border-radius:22px;padding:14px 10px;font-size:21px;font-weight:700;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;min-height:118px;text-align:center;color:var(--e-ink);font-family:var(--f-body)}
.e-opt:hover{border-color:var(--accent)}
.e-opt svg{width:40px;height:40px;color:var(--accent)}
.e-opt.danger{border-color:var(--crit)} .e-opt.danger svg{color:var(--crit)}
.e-opt.wide{grid-column:span 2;min-height:74px;flex-direction:row}
.e-type{display:flex;gap:10px}
.e-type input{flex:1;min-width:0;font-size:22px;padding:16px 18px;border:2px solid var(--e-edge);border-radius:20px;background:var(--e-card);color:var(--e-ink)}
.e-type button{width:70px;border:0;border-radius:20px;background:var(--accent);color:var(--on-accent);display:grid;place-items:center}
.e-slot{display:grid;gap:12px}
.e-slot+.e-slot{border-top:2px solid var(--e-edge);padding-top:16px}
.e-row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.e-foot{display:flex;justify-content:center;gap:18px;flex-wrap:wrap;font-size:17px;color:var(--e-sub);padding-top:6px}
.e-foot button{background:none;border:0;color:var(--accent-ink);font-weight:700;font-size:17px;text-decoration:underline;padding:6px}
.e-listen{display:grid;justify-items:center;gap:12px;padding:6px 0}
.e-mic{width:112px;height:112px;border-radius:50%;background:var(--crit);color:#fff;display:grid;place-items:center;animation:micpulse 1.4s ease-in-out infinite}
.e-mic svg{width:52px;height:52px}
@keyframes micpulse{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb,var(--crit) 45%,transparent)}50%{box-shadow:0 0 0 22px color-mix(in srgb,var(--crit) 0%,transparent)}}
@media (prefers-reduced-motion:reduce){.e-mic{animation:none}}
.e-heard{margin:0;min-height:1.4em;font-size:24px;text-align:center;font-style:italic;color:var(--e-ink)}
.e-dict{margin:0;display:flex;gap:10px;align-items:center;font-size:18px;color:var(--e-sub)}
.e-dict svg{width:28px;height:28px;flex:none;color:var(--accent)}
.e-thinking{display:inline-flex;gap:6px}
.e-thinking i{width:10px;height:10px;border-radius:50%;background:var(--accent);animation:blink 1.2s infinite}
.e-thinking i:nth-child(2){animation-delay:.2s} .e-thinking i:nth-child(3){animation-delay:.4s}
.e-streak{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.e-streak i{width:30px;height:30px;border-radius:50%;background:var(--sunk);display:grid;place-items:center;font-style:normal;font-size:13px;font-weight:700;color:var(--e-sub)}
.e-streak i.full{background:var(--ring-dose);color:var(--on-accent)} .e-streak i.part{background:var(--warn-soft);color:var(--warn)}

/* section scaffolding */
.sechead{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:20px}
.sechead h1{font-size:clamp(26px,4vw,34px)}
.sechead p{margin:6px 0 0;color:var(--muted);max-width:62ch}
.card{background:var(--surface);border-radius:var(--r);padding:20px;min-width:0;box-shadow:var(--shadow)}
.card+.card,.stack>*+*{margin-top:16px}
.card h2{font-size:17px;font-weight:600;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start}
.cols.wide{grid-template-columns:minmax(0,1.35fr) minmax(0,1fr)}
@media (max-width:1100px){.cols,.cols.wide{grid-template-columns:minmax(0,1fr)}}
.cols>.card+.card{margin-top:0}
.muted{color:var(--muted)} .small{font-size:13px} .mono{font-family:var(--f-mono);font-size:12.5px;font-variant-numeric:tabular-nums}
.eyebrow{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:700}

/* forms */
.form{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px 14px}
.f{display:flex;flex-direction:column;gap:5px;grid-column:span 3;min-width:0}
.f.s2{grid-column:span 2} .f.s4{grid-column:span 4} .f.s6{grid-column:span 6}
@media (max-width:640px){.f,.f.s2,.f.s4{grid-column:span 6}}
.f label,.f .lbl{font-size:13px;font-weight:700}
.f .hint{font-size:12px;color:var(--muted)}
input[type=text],input[type=number],input[type=date],input[type=time],input[type=tel],select,textarea{width:100%;min-width:0;border:1px solid var(--line);background:var(--sunk);border-radius:12px;padding:10px 12px;font-size:15px;color:var(--ink)}
textarea{resize:vertical;min-height:64px}
input:focus,select:focus,textarea:focus{border-color:var(--accent);background:var(--surface);outline:3px solid var(--accent-soft)}
.inrow{display:flex;gap:8px}
.inrow>*{min-width:0}
.checks{display:flex;flex-wrap:wrap;gap:6px}
.checks label{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:7px 12px;font-size:14px;font-weight:400;cursor:pointer;background:var(--surface)}
.checks input{accent-color:var(--accent);width:16px;height:16px}
.checks label:has(input:checked){border-color:var(--accent);background:var(--accent-soft);color:var(--accent-ink)}
input[type=range]{accent-color:var(--accent);width:100%}
.sev{display:flex;align-items:center;gap:10px}
.sev output{font-family:var(--f-mono);font-weight:500;min-width:44px;text-align:right}
.formfoot{grid-column:span 6;display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding-top:4px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:9px 16px;font-weight:700;font-size:14px;display:inline-flex;align-items:center;gap:6px;text-decoration:none;color:var(--ink);transition:background .15s,border-color .15s}
.btn:hover{border-color:var(--line-strong);background:var(--sunk)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary:hover{filter:brightness(1.06);background:var(--accent)}
.btn.sm{padding:5px 12px;font-size:13px}

const nowMins=()=>{const d=new Date();return d.getHours()*60+d.getMinutes()};
const dur=m=>m>=60?Math.floor(m/60)+' h'+(m%60?' '+(m%60)+' min':''):m+' min';
function cdInfo(slot,status){
  if(status==='taken')return {cls:'done',txt:'Taken'};
  if(status==='skipped')return {cls:'late',txt:'Skipped'};
  const d=minsOf(slotT(slot))-nowMins();
  if(d>60)return {cls:'',txt:'in '+dur(d)};
  if(d>0)return {cls:'soon',txt:'in '+dur(d)};
  if(d>-30)return {cls:'late',txt:'Due now'};
  return {cls:'late',txt:'Overdue by '+dur(-d)};
}

function chains(){

function vitalFlag(v){

  if(v.type==='temp'){if(v.value>=38)return['warn','Fever'];if(v.value<35.5)return['warn','Low'];return['ok','Normal']}

function chatBubbles(){return state.chat.map((m,i)=>{

    return `<div class="msg ${cls}${m.urgent?' urgent':''}">${m.who==='fam'?'<b>'+esc(m.from)+':</b> ':''}${body}<span class="by">${m.who==='me'?esc(state.patient.short):m.who==='fam'?'Family message':'EchoCare'+(m.ai===false?' \u00b7 offline rules':'')} \u00b7 ${esc(m.ts)}</span>${tags}${share}</div>`;
  }).join('')}
/* The things worth a carer's attention from her conversation, grouped instead of listed one by one */
function convoSummary(){
  const sym={},dose=[],read=[],newm=[],urgent=[];
  state.chat.forEach(m=>(m.tags||[]).forEach(([k,t])=>{if(t.startsWith('Symptom: ')){const x=t.slice(9);sym[x]=(sym[x]||0)+1}
    else if(/dose logged|: taken|: missed/.test(t))dose.push(t);else if(/^(Blood pressure|Blood sugar|Weight|Temp|Pulse)/.test(t))read.push(t);
    else if(t.startsWith('New medicine to confirm'))newm.push(t.replace('New medicine to confirm: ',''));else if(/Family alerted/.test(t))urgent.push(m.ts)}));
  const li=[];
  if(urgent.length)li.push(`<li class="crit"><b>Emergency words used</b> at ${esc(urgent.join(', '))}. Family was alerted.</li>`);
  const ss=Object.entries(sym);if(ss.length)li.push(`<li><b>Symptoms she described:</b> ${ss.map(([x,n])=>esc(x.toLowerCase())+(n>1?' ('+n+' times)':'')).join(', ')}.</li>`);
  const missed=dose.filter(d=>/missed/.test(d));if(missed.length)li.push(`<li><b>Missed doses she mentioned:</b> ${esc(missed.map(d=>d.replace(/: missed/,'')).join(', '))}.</li>`);
  if(newm.length)li.push(`<li><b>New medicines to check:</b> ${esc([...new Set(newm)].join(', '))}. Confirm them under Medicines.</li>`);
  if(read.length)li.push(`<li><b>Readings she gave:</b> ${esc(read.join(', '))}.</li>`);
  const took=dose.filter(d=>!/missed/.test(d));if(took.length)li.push(`<li>${took.length} dose${took.length>1?'s':''} confirmed by her in conversation.</li>`);
  return li.length?`<ul class="summary">${li.join('')}</ul>`:'<div class="empty">Nothing to note yet.</div>';
}
let aiSum=null,aiSumBusy=false;
async function aiSummary(){
  if(aiSumBusy)return;if(!sample){toast('AI summaries need permission to use Claude.');return}

  try{const lines=state.chat.filter(c=>!c.pending).slice(-30).map(c=>(c.who==='me'?state.patient.short:c.who==='fam'?'Family':'EchoCare')+': '+c.text).join('\n');
    const r=await sample(`Summarise this conversation between an older adult and their medication companion for their family carer. Give at most 4 short bullet points, most important first: new or worsening symptoms, missed or extra doses, new medicines, and anything unusual. Ignore small talk. Plain words, no diagnosis, no advice to change medicines. Start each bullet with "- ".\n\n${lines}`,{modelTier:'quick'});
    aiSum=String(r&&r.text||'').split('\n').map(x=>x.replace(/^\s*[-*]\s*/,'').trim()).filter(Boolean).slice(0,4)}
  catch(e){toast('Could not summarise right now.');if(e&&e.code==='not_granted')sample=null}
  aiSumBusy=false;render();
}

function fdaPanel(m){

  const max=d.top[0][1];const hits=Object.entries(d.sig).filter(([s])=>mine.has(s));
  return `<details class="fda"><summary>FDA reports from people over 65${hits.length?` <span class="chip crit">${hits.length} match her symptoms</span>`:''}</summary>
   <div class="bars">${d.top.map(([t,n])=>`<div><span>${esc(t)}</span><span class="b" style="width:${(n/max*100).toFixed(0)}%"></span><span class="mono">${nf(n)}</span></div>`).join('')}
   ${hits.map(([s,n])=>`<div class="hit"><span>${esc(cap(SIGTERM[s]))}</span><span class="b" style="width:${Math.max(4,n/max*100).toFixed(0)}%"></span><span class="mono">${nf(n)}</span></div>`).join('')}</div>

}

function phoneCheck(cc,raw){

  const rb=$('overlay').querySelector('.remind');if(rb)rb.classList.add('flash');try{navigator.vibrate&&navigator.vibrate([400,200,400,200,400])}catch(e){}
  clearInterval(window.__rmRep);let rmTick=0;window.__rmRep=setInterval(()=>{const open=!$('overlay').hidden&&$('overlay').querySelector('.remind.flash');if(!open||++rmTick>400){clearInterval(window.__rmRep);document.title='EchoCare Companion';return}document.title=rmTick%2?'Medicine time':'EchoCare Companion';if(rmTick%20===0)beep()},1500);

function checkReminders(){
  if(DEMO.on||APP!=='elder'||!state.prefs.reminders||!$('overlay').hidden)return;
  const due=todayDoses().filter(d=>d.status==='due'&&minsOf(slotT(d.slot))<=nowMins());if(!due.length)return;
  const rm=state.remind[T]=state.remind[T]||{};
  // escalate doses still untaken 2 hours after their time
  [...new Set(due.map(d=>d.slot))].forEach(sl=>{if(nowMins()-minsOf(slotT(sl))>=120&&!(rm[sl]&&rm[sl].escalated)){rm[sl]=Object.assign({},rm[sl],{escalated:true});state.family.feed.push({from:'EchoCare',text:`${state.patient.short} has not confirmed her ${SLOTL[sl].toLowerCase()} medicines (due ${clock(slotT(sl))}). A quick call may help.`,ts:T+' '+hm()});state.events.push({sev:'warn',title:`${SLOTL[sl]} medicines not confirmed`,text:`Due at ${clock(slotT(sl))}. Family has been told.`,ts:T+' '+hm()});save()}});
  const slot=[...new Set(due.map(d=>d.slot))].sort((a,b)=>minsOf(slotT(a))-minsOf(slotT(b))).find(sl=>{const r=rm[sl]||{};return !r.dismissed&&!(r.snoozeUntil&&nowMins()<r.snoozeUntil)&&!(r.shown&&!r.snoozeUntil)});
  if(slot)showReminder(slot,false);
}
function tick(){

  document.querySelectorAll('[data-cd]').forEach(el=>{const c=cdInfo(el.dataset.cd,el.dataset.st);el.className=(el.dataset.big?'cdbig ':'cd ')+c.cls;el.textContent=c.txt});
  document.querySelectorAll('[data-ecd]').forEach(el=>{const w=eWhen(el.dataset.ecd,el.dataset.st);el.className='e-when '+w.c;el.textContent=w.t});
  if($('nowClock'))$('nowClock').textContent=clockNow();
  checkReminders();
}

    const name=$('m_name').value.trim();if(!name)return;const slots=[...document.querySelectorAll('input[name=m_slot]:checked')].map(x=>x.value);const prn=$('m_prn').checked||!slots.length;
    const c=classify(name,window.__photoIng);
    const o={name:cap(name),strength:$('m_strength').value.trim(),form:$('m_form').value,qty:+$('m_qty').value||0,dosePerTake:+$('m_dose').value||1,slots:prn&&!slots.length?[]:slots,prn:prn&&!slots.length,withFood:$('m_food').value,color:$('m_color').value,shape:$('m_shape').value,start:$('m_start').value||T,source:$('m_source').value,reason:$('m_reason').value.trim(),prescriber:$('m_pres').value.trim(),notes:$('m_notes').value.trim(),cls:c.cls,ing:c.ing};
    if(window.__medThumb&&$('m_usephoto')&&$('m_usephoto').checked)o.photo=window.__medThumb;
    if(!window.__editMed&&window.__preOK!==o.name.toLowerCase()){const w=preCheck(o);if(w.length){window.__preOK=o.name.toLowerCase();const box=$('preWarn');if(box){box.innerHTML=`<b>Before she takes ${esc(o.name)}</b><ul>${w.map(x=>`<li>${x}</li>`).join('')}</ul><span>Check with her pharmacist or doctor before starting. You can still add it.</span>`;box.hidden=false;box.scrollIntoView({block:'nearest'})}const sb=$('medForm').querySelector('.formfoot .btn.primary');if(sb)sb.textContent='Add anyway';return}}
    window.__preOK=null;
    let msg;if(window.__editMed){const m=state.meds.find(x=>x.id===window.__editMed);Object.assign(m,o,{unconfirmed:false});msg='Medicine updated'}
    else{state.meds.push(Object.assign({id:uid(),via:photoResult&&photoResult.identified?'Photo (AI)':'Typed',unconfirmed:false,stopped:false},o));msg='Medicine added'}
    window.__editMed=null;photoFile=null;photoResult=null;window.__thumb=null;window.__photoIng=null;window.__medThumb=null;
    const warn=interactions().filter(i=>i.text.includes(o.name)).length+chains().filter(x=>x.a.name===o.name||(x.b&&x.b.name===o.name)).length;
    commit(warn?msg+'. '+warn+' safety finding'+(warn>1?'s':'')+' to review':msg);return}
  if(f==='symForm'){
    const key=$('s_key').value;if(key==='other'&&!$('s_other').value.trim()){toast('Type the symptom first.');$('s_other').focus();return}const label=key==='other'?cap($('s_other').value.trim()):SYMK[key].label;
    state.symptoms.push({id:uid(),key,label,area:$('s_area').value,severity:+$('s_sev').value,start:$('s_start').value||T,freq:$('s_freq').value,time:$('s_time').value,trend:$('s_trend').value,notes:$('s_notes').value.trim(),source:$('s_by').value===state.patient.short?'Typed':$('s_by').value,resolved:false,mentions:[$('s_start').value||T]});
    const after=$('s_after').value;if(after)state.reports.push({id:uid(),medId:after,key,label,date:$('s_start').value||T,note:'Logged with symptom'});
    if(SYMK[key]&&SYMK[key].emer)state.events.push({sev:'crit',title:'Emergency symptom logged',text:label+(key==='faint'?'. If it does not pass, call 995.':'. Call 995.'),ts:T+' '+hm()});
    const n=chains().filter(c=>c.rule.sym.includes(key)).length;commit(n?'Saved. Possible medicine link found':'Symptom saved');return}
  if(f==='repForm'){const m=$('r_med').value,k=$('r_key').value;state.reports.push({id:uid(),medId:m,key:k,label:SYMK[k].label,date:$('r_date').value||T,note:($('r_note').value.trim()||SYMK[k].label)+' (by '+$('r_by').value.toLowerCase()+')'});
    const has=chains().some(c=>c.a.id===m&&c.rule.sym.includes(k));commit(has?'Report added to a side-effect chain':'Report saved. No known pattern for this pair yet');return}
  if(f==='ciForm'){const mood=document.querySelector('input[name=ci_mood]:checked');const talk=document.querySelector('input[name=ci_talk]:checked');
    let c=state.checkins.find(x=>x.date===T);if(!c){c={date:T};state.checkins.push(c)}
    Object.assign(c,{mood:mood?+mood.value:c.mood||null,sleep:$('ci_sleep').value===''?null:+$('ci_sleep').value,pain:$('ci_pain').value===''?null:+$('ci_pain').value,appetite:$('ci_app').value,talked:talk?talk.value==='yes':!!c.talked,note:$('ci_note').value.trim()});
    if(c.talked===false&&c.mood&&c.mood<=2)state.family.feed.push({from:'EchoCare',text:state.patient.short+' is feeling low and has not talked with anyone today. A call would help.',ts:T+' '+hm()});
    commit('Check-in saved');return}
  if(f==='remForm'){const pf=state.prefs,rm=state.remind[T]=state.remind[T]||{};SLOTS.forEach(s=>{const v=$('rt_'+s.k).value;if(v&&v!==pf.slotTimes[s.k]){pf.slotTimes[s.k]=v;rm[s.k]={}}});pf.snooze=+$('rt_snooze').value;pf.reminders=$('rt_on').checked;pf.sound=$('rt_sound').checked;pf.wake=!!($('rt_wake')&&$('rt_wake').checked);commit('Reminder times saved');return}
  if(f==='checkForm'){const miss=ciMissing();if(miss.length){ciValidate();toast('Please answer '+miss.join(', ')+'.');return}const mood=document.querySelector('input[name=ci_mood]:checked');
    let c=state.checkins.find(x=>x.date===T);if(!c){c={date:T};state.checkins.push(c)}
    const by=[...document.querySelectorAll('input[name=ci_sup]:checked')].map(x=>x.value);const o=$('ci_supOther').value.trim();if(o)by.push(o);
    Object.assign(c,{mood:mood?+mood.value:c.mood||null,sleep:$('ci_sleep').value===''?null:+$('ci_sleep').value,pain:$('ci_pain').value===''?null:+$('ci_pain').value,appetite:$('ci_app').value,note:$('ci_note').value.trim(),talked:by.length?true:!!c.talked});
    state.supervision=state.supervision||{};if(by.length)state.supervision[T]={by,at:hm()};else delete state.supervision[T];
    const syms=[...document.querySelectorAll('input[name=ci_sym]:checked')].map(x=>x.value);c.symLog=(c.symLog||[]).concat(syms.map(k=>logSymptom(k,'Check-in')).filter(x=>x.added));c.done=true;c.at=hm();
    commit('Check-in saved'+(syms.length?'. '+syms.length+' symptom'+(syms.length>1?'s':'')+' added':''));return}
  if(f==='profForm'){const p=state.patient,nm=$('p_name').value.trim();if(!nm){toast('Enter her name.');return}p.name=nm;p.short=$('p_short').value.trim()||nm.split(' ')[0];p.age=+$('p_age').value||p.age;p.livesAlone=$('p_alone').checked;p.pronoun=$('p_pron').value;p.phone=$('p_phone').value.trim();p.conditions=$('p_cond').value.trim();p.allergies=$('p_all').value.trim();commit('Profile saved');return}
  if(f==='conForm'){const n=$('c_name').value.trim();if(!n){toast('Enter their name.');return}const ph=phoneCheck($('c_cc').value,$('c_phone').value);if(!ph.ok){phoneHint();toast(ph.msg);$('c_phone').focus();return}state.family.contacts.push({id:uid(),name:n,relation:$('c_rel').value,phone:ph.full,notify:$('c_notify').value});commit(n+' added');return}
  if(f==='apForm'){state.appts.push({id:uid(),date:$('a_date').value,time:$('a_time').value,with:$('a_with').value.trim(),place:$('a_place').value.trim(),purpose:$('a_purpose').value.trim()});commit('Appointment added');return}
});

function setApp(a){APP=a;try{history.replaceState(null,'','#'+a)}catch(e){}closeOverlay();if(a==='elder')ev='home';else section='overview';render();window.scrollTo({top:0})}
window.addEventListener('hashchange',()=>{if(location.hash==='#demo'){demoStart();return}{const j=location.hash.match(/^#join-([A-Za-z0-9]{6,12})$/);if(j){askJoin(j[1]);return}}if(location.hash==='#memo'){APP='family';section='memo';render();return}const want=location.hash==='#family'?'family':'elder';if(want!==APP){APP=want;closeOverlay();if(APP==='elder')ev='home';else section='overview';render();window.scrollTo({top:0})}});
render();initCloud();initAI();
if(location.hash==='#demo')demoStart();
if(location.hash==='#memo'){section='memo';render()}
setTimeout(tick,3500);setInterval(tick,20000);
</script>
